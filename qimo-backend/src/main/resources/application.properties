# ============================================================
# 羽翼守望者 · 后端配置
# ============================================================
# 分离后本工程只提供 /api/** 接口。这里不再有
# spring.web.resources.* 之类的静态资源配置——页面归前端工程管。
# ============================================================

# ---------- 数据源 ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bird_atlas?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=bxy060522

# ---------- 建表脚本 ----------
# always：每次启动都执行 init.sql。脚本里全是 CREATE TABLE IF NOT EXISTS，
# 重复执行是安全的；而 spring.sql.init.continue-on-error=true 保证
# "CREATE USER IF NOT EXISTS / GRANT" 这类需要额外权限的语句失败时不会
# 把整个后端起不来（表已经建好的情况下它们本来就会报 warning）。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
spring.sql.init.continue-on-error=true

# ---------- HTTP 端口 ----------
server.port=8080

# ---------- 登录态（HttpSession + Cookie） ----------
# 后端把登录用户放在 HttpSession 的 userId/username 两个属性里，
# 会话标识走 Cookie。Cookie 的名字由 config/SessionConfig.java 固定为
# connect.sid（与原先 Node 版保持一致），这里只管有效期与安全属性。
server.servlet.session.timeout=7d

# 跨源（前端 5173 -> 后端 8080）时 Cookie 必须 SameSite=None + Secure，
# 而那要求 HTTPS，因此默认关闭；把库放在 Nginx 同域反向代理后面时用 Lax 即可。
# 需要真正的跨源 Cookie 时，把下面两行打开，并自行准备 HTTPS。
#server.servlet.session.cookie.same-site=none
#server.servlet.session.cookie.secure=true

# ---------- CORS ----------
# 前端开发服务器 / 部署地址，逗号分隔，不要带结尾斜杠。
# 通配符 * 与 allowCredentials 互斥，所以这里必须写精确来源。
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500
app.cors.max-age=3600

# ---------- 日志 ----------
logging.level.com.eco.bird=info
